# INGESTION override. Layer it on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.ingest.yml up -d vllm
#   docker compose -f docker-compose.yml -f docker-compose.ingest.yml run --rm app python ingest.py
#
# Why an override rather than one config for both jobs: ingestion needs the
# vision model to transcribe scanned pages, but serving does not, and carrying
# the vision tower plus its multimodal encoder cache into the serving config
# would cost VRAM that is better spent on KV cache. So the vision model is
# switched on only for the one-time ingest, then switched back off.
#
# `command` is a list, and compose replaces lists rather than merging them, so
# the block below fully supersedes the serving command.

services:
  vllm:
    command:
      - --model=/model
      - --served-model-name=google/gemma-4-E2B-it
      - --max-model-len=8192

      # The whole point of this override: images enabled, so ingest.py can send
      # rendered pages to the vision model for transcription.
      - '--limit-mm-per-prompt={"image": 1}'

      # 280 soft tokens per image is the Gemma 4 default and is enough for a
      # regulatory page. Raise to 560 only if transcription quality is poor on
      # dense tables -- it roughly doubles the per-page cost.
      - '--mm-processor-kwargs={"max_soft_tokens": 280}'

      - --gpu-memory-utilization=0.88
      - --max-num-seqs=16          # ingest is throughput work, not latency work
      - --api-key=${VLLM_API_KEY}

  app:
    environment:
      - VLLM_HOSTS=http://vllm:8000
      - VLLM_API_KEY=${VLLM_API_KEY}
      - LLM_MODEL=google/gemma-4-E2B-it
      - DATASET_DIR=/app/dataset
      - INDEX_DIR=/app/index

      # How many pages are transcribed at once. The prototype used a
      # Semaphore(1) here, so every scanned page went through strictly one at a
      # time; this is the main reason its ingest took hours. Lower it if vLLM
      # reports preemption in its logs.
      - VISION_CONCURRENCY=8

      # Batch embedding wants more than the serving default of 1 thread, but not
      # one per core. ingest.py sets 8 itself; this makes it explicit.
      - OMP_NUM_THREADS=8

      # Opt-in multiprocessing for the embedding pass. 0 = single process, which
      # is safe everywhere and does the whole corpus in roughly 7 minutes. Set
      # to 4 for about 4x that, if multiprocessing behaves in your container.
      - EMBED_PARALLEL=0
